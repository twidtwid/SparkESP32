name: New device
description: Propose porting SparkESP32 to another ESP32 board
title: "[Device]: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Open this before you start a port, so we can confirm the board fits.
        [docs/adding-a-device.md](https://github.com/twidtwid/SparkESP32/blob/main/docs/adding-a-device.md)
        is the how-to, and [CONTRIBUTING.md](https://github.com/twidtwid/SparkESP32/blob/main/CONTRIBUTING.md#adding-a-new-device)
        says what the pull request needs.

  - type: input
    id: board
    attributes:
      label: Board
      description: Maker, model, and a link to its product page or wiki
      placeholder: Acme ESP32-S3-LCD-3.5, https://example.com/esp32-s3-lcd-3.5
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - ESP32-C3
        - ESP32-C5
        - ESP32-C6
        - ESP32-S3
        - Other (explain below)
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display
      description: Size, resolution, color or black-and-white, controller and bus if known
      placeholder: 3.5" 480x320 color IPS, ST7796 over SPI
    validations:
      required: true

  - type: input
    id: memory
    attributes:
      label: Flash and PSRAM
      placeholder: 16 MB flash, 8 MB octal PSRAM
    validations:
      required: true

  - type: textarea
    id: usb
    attributes:
      label: USB ID
      description: |
        Plug the board in and run `python3 -m serial.tools.list_ports -v` (needs `pip install pyserial`).
        Paste the board's entry. Remove the `SER=` value: it's the board's MAC address.
      render: text
      placeholder: |
        /dev/ttyACM0
            desc: USB JTAG/serial debug unit
            hwid: USB VID:PID=303A:1001 LOCATION=1-1:1.0
    validations:
      required: true

  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: The board shows up as VID:PID 303A:1001 (the chip's own USB-Serial/JTAG, not a USB-UART bridge).
          required: true
        - label: I have the board and can run the checks in docs/adding-a-device.md on it.
          required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Vendor example code and its license, a PMIC or IO expander in front of the panel, anything unusual
