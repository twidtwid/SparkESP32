name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters and pyserial
        run: python -m pip install --disable-pip-version-check ruff pyserial==3.5
      - name: make check
        run: make check

  boards:
    name: List boards
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        # every firmware/boards/<id>/ with its chip, so a new board is built here automatically
        run: |
          list=$(for b in $(make -s boards); do
            t=$(sed -n 's/^CONFIG_IDF_TARGET="\{0,1\}\([a-z0-9]*\)"\{0,1\}$/\1/p' "firmware/boards/$b/sdkconfig.defaults")
            printf '{"board":"%s","target":"%s"}\n' "$b" "$t"
          done | jq -s -c .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  firmware:
    name: Firmware (${{ matrix.board }})
    needs: boards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        # The ESP-IDF image plus LVGL's bundled test images can fill the runner's disk
        # (ENOSPC in the component manager). Drop toolchains this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build firmware and release bundle
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.6
          target: ${{ matrix.target }}
          command: make bundle BOARD=${{ matrix.board }}
      - name: Upload firmware bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sparkesp32-${{ matrix.board }}
          path: dist/
          if-no-files-found: error
