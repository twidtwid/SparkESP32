name: Release

on:
  push:
    tags:
      - "v*"

# Each job says what it needs. The build runs other people's code (the ESP-IDF image, the
# components it downloads), so it only reads; the job that can write a release runs none.
permissions:
  contents: read

jobs:
  build:
    name: Build every board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false    # no token left in .git for the build to find

      - name: Tag must match VERSION
        run: |
          want="v$(head -n1 VERSION)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want (VERSION)"; exit 1; }

      - name: Free runner disk
        # The ESP-IDF image plus LVGL's bundled test images can fill the runner's disk
        # (ENOSPC in the component manager). Drop toolchains this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build every board's release bundle
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.6
          # only the container's default IDF_TARGET: make dist sets each board's own chip
          target: esp32c6
          command: make dist

      - name: Verify every bundle install.sh can download
        run: |
          v="$(head -n1 VERSION)"
          (cd dist && sha256sum -c SHA256SUMS)
          for b in $(make -s boards); do
            pkg="sparkesp32-$b-firmware-$v"
            mkdir -p "/tmp/verify/$b" && tar -xzf "dist/$pkg.tar.gz" -C "/tmp/verify/$b"
            (cd "/tmp/verify/$b/$pkg" && sha256sum -c SHA256SUMS && test -s flash_args)
          done

      - name: Hand the bundles to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*-merged.bin
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    steps:
      - name: Fetch the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check they are what the build job made
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest that this workflow built them from this tag
        # anyone can check a download: gh attestation verify <file> --repo <this repo>
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # the build job checked the tag is v<VERSION>
          flags=(--verify-tag --generate-notes --title "SparkESP32 ${GITHUB_REF_NAME#v}")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            dist/*.tar.gz dist/*-merged.bin dist/SHA256SUMS
